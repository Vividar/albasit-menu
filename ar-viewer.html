<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>Al Basit — AR View</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0A0300;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
  
  .header{
    background:linear-gradient(180deg,#1A0800,#0A0300);
    padding:14px 16px;
    border-bottom:2px solid #E8620A44;
    display:flex;align-items:center;gap:12px;
  }
  .header-text .label{font-size:8px;color:#E8620A;letter-spacing:3px;font-weight:700;}
  .header-text .title{font-size:18px;font-weight:800;color:#F5E2C4;}
  
  model-viewer{
    width:100%;
    flex:1;
    min-height:60vh;
    background:radial-gradient(ellipse at 50% 60%,#2E1206,#0A0300);
    --poster-color:transparent;
  }
  
  .bottom{
    background:linear-gradient(180deg,#1A0800,#0A0300);
    padding:16px;
    border-top:1px solid #E8620A22;
  }
  .item-name{font-size:20px;font-weight:800;color:#F5E2C4;margin-bottom:4px;}
  .item-sub{font-size:12px;color:#8A6644;margin-bottom:6px;}
  .price{font-size:14px;color:#E8620A;font-weight:700;margin-bottom:14px;}
  
  .ar-btn{
    width:100%;padding:15px;
    background:linear-gradient(135deg,#E8620A,#FF7A1A);
    border:none;border-radius:14px;
    color:#fff;font-size:16px;font-weight:800;
    cursor:pointer;letter-spacing:0.5px;
    box-shadow:0 0 24px #E8620A77;
    margin-bottom:10px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .ar-btn:active{transform:scale(0.98);}
  
  .back-btn{
    width:100%;padding:11px;
    background:transparent;
    border:1px solid #E8620A44;
    border-radius:12px;
    color:#8A6644;font-size:13px;
    cursor:pointer;
  }
  
  .tip{
    font-size:10px;color:#8A664466;
    text-align:center;margin-top:10px;
    line-height:1.5;
  }
  
  .loading-msg{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    color:#E8620A;font-size:13px;
    text-align:center;
  }
  
  /* AR not available message */
  .no-ar{
    display:none;
    width:100%;padding:14px;
    background:#E6394618;
    border:1px solid #E6394644;
    border-radius:12px;
    color:#E63946;font-size:12px;
    text-align:center;margin-bottom:10px;
  }
</style>
</head>
<body>

<div class="header">
  <div style="font-size:28px">🍕</div>
  <div class="header-text">
    <div class="label">◈ AL BASIT ◈</div>
    <div class="title">AR 3D Viewer</div>
  </div>
</div>

<model-viewer
  id="viewer"
  src=""
  alt="Food 3D Model"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  camera-controls
  touch-action="pan-y"
  auto-rotate
  auto-rotate-delay="500"
  rotation-per-second="15deg"
  shadow-intensity="1.2"
  exposure="1.1"
  environment-image="neutral"
  style="--poster-color:transparent;"
>
  <div class="loading-msg" slot="progress-bar">Loading 3D Model...</div>
</model-viewer>

<div class="bottom">
  <div class="item-name" id="itemName">Loading...</div>
  <div class="item-sub" id="itemSub"></div>
  <div class="price" id="itemPrice"></div>
  
  <div class="no-ar" id="noArMsg">
    AR is not supported on this device/browser. Try opening in Safari (iPhone) or Chrome (Android).
  </div>
  
  <button class="ar-btn" id="arBtn" onclick="activateAR()">
    📱 VIEW IN AR — Place on Table
  </button>
  
  <button class="back-btn" onclick="window.history.back()">← Back to Menu</button>
  
  <div class="tip">
    Tap "VIEW IN AR" → Point camera at flat surface → Food appears on table!<br/>
    Works on iPhone (Safari) & Android (Chrome)
  </div>
</div>

<script>
  const viewer = document.getElementById('viewer');
  
  // Get params from URL
  const params = new URLSearchParams(window.location.search);
  const modelUrl = params.get('model');
  const name = params.get('name') || 'Food Item';
  const sub = params.get('sub') || '';
  const price = params.get('price') || '';
  
  // Set model
  if(modelUrl) {
    viewer.setAttribute('src', modelUrl);
  }
  
  // Set text
  document.getElementById('itemName').textContent = name;
  document.getElementById('itemSub').textContent = sub;
  if(price) document.getElementById('itemPrice').textContent = 'from Rs. ' + price;
  
  // Check AR support
  viewer.addEventListener('load', () => {
    if(!viewer.canActivateAR) {
      document.getElementById('noArMsg').style.display = 'block';
      document.getElementById('arBtn').textContent = '👁 View in 3D Only';
    }
  });
  
  function activateAR() {
    if(viewer.canActivateAR) {
      viewer.activateAR();
    } else {
      alert('AR not supported on this browser. Try Safari on iPhone or Chrome on Android.');
    }
  }
</script>

</body>
</html>
